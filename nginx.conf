server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    # Achtung: add_header in einem location-Block ersetzt alle add_header von hier.
    # Deshalb stehen die Sicherheits-Header in jedem Block erneut (per include wäre schöner,
    # aber so bleibt alles in einer Datei).
    set $csp "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";

    # Versionierte Dateien: /v/<commit>/js/app.js liefert /js/app.js aus.
    # Die URL ändert sich mit jedem Deployment, deshalb darf sie unbegrenzt gecacht werden.
    # So bekommt nach einem Update jeder Browser sofort die neuen Dateien, auch hinter Cloudflare.
    location ^~ /v/ {
        rewrite ^/v/[^/]+/(.*)$ /$1 break;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy $csp always;
    }

    # Konten und Lernstand: weiter an den API-Container.
    # Mit Variable und Docker-DNS, damit nginx auch startet und weiterläuft, wenn die API neu erstellt wird.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 512k;
        proxy_read_timeout 20s;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Die Startseite nennt die aktuelle Version und darf nie aus dem Cache kommen.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy $csp always;
    }
}
