name: lernplattform

services:
  web:
    image: nginx:1.27-alpine
    container_name: lernplattform
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3005:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Konten, Lernstand und Verwaltung. Nur über nginx erreichbar (/api/), kein eigener Port nach außen.
  api:
    image: node:22-alpine
    container_name: lernplattform-api
    restart: unless-stopped
    working_dir: /app
    command: ["node", "--no-warnings", "server.mjs"]
    environment:
      PORT: "3000"
      DATA_DIR: /data
      # Startpasswort für das Verwaltungskonto „Ivan“, nur beim allerersten Start nötig. Steht in .env (nicht im Repo).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./server:/app:ro
      - ./data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
